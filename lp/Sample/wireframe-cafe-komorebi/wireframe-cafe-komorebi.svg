<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2600" viewBox="0 0 1200 2600" role="img" aria-labelledby="title desc">
  <title id="title">KOMOREBI COFFEE landing page wireframe</title>
  <desc id="desc">Static SVG wireframe converted from the KOMOREBI COFFEE HTML and CSS landing page.</desc>
  <defs>
    <style>
      .bg { fill: #f6efe3; }
      .surface { fill: #fffaf2; stroke: rgba(77,54,34,0.18); stroke-width: 2; }
      .surface-alt { fill: #e7efe1; stroke: rgba(77,54,34,0.18); stroke-width: 2; }
      .ink { fill: #251a13; }
      .muted { fill: #6f6256; }
      .leaf { fill: #385d40; }
      .coffee { fill: #321d15; }
      .line { stroke: rgba(77,54,34,0.2); stroke-width: 2; }
      .image-box { fill: #d8c8b4; stroke: rgba(77,54,34,0.22); stroke-width: 2; }
      .image-line { stroke: rgba(77,54,34,0.35); stroke-width: 2; }
      .h1 { font: 700 54px Georgia, serif; }
      .h2 { font: 700 36px Georgia, serif; }
      .h3 { font: 700 22px Arial, sans-serif; }
      .body { font: 400 18px Arial, sans-serif; }
      .small { font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; }
      .label { font: 700 16px Arial, sans-serif; }
      .micro { font: 400 13px Arial, sans-serif; }
      .button-text { font: 700 15px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="2600"/>
  <rect x="40" y="34" width="1120" height="2526" rx="8" fill="#fffaf2" opacity="0.45"/>

  <g id="header">
    <rect class="surface" x="70" y="44" width="1060" height="84" rx="8"/>
    <circle class="coffee" cx="116" cy="86" r="24"/>
    <text x="116" y="91" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">KC</text>
    <text class="label ink" x="154" y="80">KOMOREBI COFFEE</text>
    <text class="micro muted" x="154" y="101">Roastery &amp; Bake</text>
    <text class="body muted" x="570" y="92" text-anchor="middle">Top</text>
    <text class="body muted" x="635" y="92" text-anchor="middle">Menu</text>
    <text class="body muted" x="710" y="92" text-anchor="middle">Story</text>
    <text class="body muted" x="790" y="92" text-anchor="middle">Access</text>
    <a href="#highlights">
      <rect class="surface" x="858" y="64" width="112" height="44" rx="22"/>
      <text class="button-text ink" x="914" y="91" text-anchor="middle">Hours</text>
    </a>
    <a href="#cta">
      <rect class="coffee" x="986" y="64" width="112" height="44" rx="22"/>
      <text class="button-text" x="1042" y="91" text-anchor="middle" fill="#ffffff">Reserve</text>
    </a>
  </g>

  <g id="hero">
    <text class="small leaf" x="80" y="214">SPECIALTY COFFEE &amp; MORNING PLATE</text>
    <text class="h1 ink" x="80" y="282">KOMOREBI COFFEE</text>
    <text class="h2 ink" x="80" y="326">Roastery cafe landing page</text>
    <text class="body muted" x="80" y="376">A warm neighborhood cafe for morning plates, roasted coffee,</text>
    <text class="body muted" x="80" y="404">seasonal sweets, quiet reading time, takeout, and reservations.</text>
    <a href="#cards">
      <rect class="coffee" x="80" y="444" width="150" height="46" rx="23"/>
      <text class="button-text" x="155" y="473" text-anchor="middle" fill="#ffffff">View Menu</text>
    </a>
    <a href="#stories">
      <rect class="surface" x="244" y="444" width="160" height="46" rx="23"/>
      <text class="button-text ink" x="324" y="473" text-anchor="middle">Our Story</text>
    </a>

    <rect class="image-box" x="665" y="190" width="455" height="345" rx="8"/>
    <line class="image-line" x1="665" y1="535" x2="1120" y2="190"/>
    <line class="image-line" x1="665" y1="190" x2="1120" y2="535"/>
    <text class="label ink" x="892" y="372" text-anchor="middle">Hero Image</text>
    <rect class="surface" x="665" y="562" width="218" height="112" rx="8"/>
    <text class="h3 ink" x="689" y="606">Morning Set</text>
    <text class="micro muted" x="689" y="632">Weekday 8:00-11:00</text>
    <rect class="surface-alt" x="902" y="562" width="218" height="112" rx="8"/>
    <text class="h3 ink" x="926" y="606">Roasted Daily</text>
    <text class="micro muted" x="926" y="632">Small batch coffee</text>
  </g>

  <g id="cards">
    <text class="small leaf" x="80" y="796">FEATURED MENU</text>
    <text class="h2 ink" x="80" y="842">Four signature menu cards</text>
    <a href="#cta">
      <rect class="surface" x="930" y="785" width="190" height="42" rx="21"/>
      <text class="button-text ink" x="1025" y="811" text-anchor="middle">Takeout Request</text>
    </a>
    <g>
      <rect class="surface" x="80" y="890" width="250" height="230" rx="8"/>
      <rect class="surface-alt" x="106" y="918" width="48" height="48" rx="8"/>
      <text class="label leaf" x="130" y="948" text-anchor="middle">01</text>
      <text class="h3 ink" x="106" y="1000">Signature Latte</text>
      <text class="body muted" x="106" y="1038">Rich roast, smooth milk,</text>
      <text class="body muted" x="106" y="1064">and a calm daily cup.</text>
    </g>
    <g>
      <rect class="surface" x="360" y="890" width="250" height="230" rx="8"/>
      <rect class="surface-alt" x="386" y="918" width="48" height="48" rx="8"/>
      <text class="label leaf" x="410" y="948" text-anchor="middle">02</text>
      <text class="h3 ink" x="386" y="1000">Iced Oat Latte</text>
      <text class="body muted" x="386" y="1038">Light, clean, and easy</text>
      <text class="body muted" x="386" y="1064">for work breaks.</text>
    </g>
    <g>
      <rect class="surface" x="640" y="890" width="250" height="230" rx="8"/>
      <rect class="surface-alt" x="666" y="918" width="48" height="48" rx="8"/>
      <text class="label leaf" x="690" y="948" text-anchor="middle">03</text>
      <text class="h3 ink" x="666" y="1000">Seasonal Cream Latte</text>
      <text class="body muted" x="666" y="1038">A dessert-like seasonal</text>
      <text class="body muted" x="666" y="1064">coffee option.</text>
    </g>
    <g>
      <rect class="surface" x="920" y="890" width="200" height="230" rx="8"/>
      <rect class="surface-alt" x="946" y="918" width="48" height="48" rx="8"/>
      <text class="label leaf" x="970" y="948" text-anchor="middle">04</text>
      <text class="h3 ink" x="946" y="1000">Croissant Set</text>
      <text class="body muted" x="946" y="1038">Fresh baked pastry</text>
      <text class="body muted" x="946" y="1064">with coffee.</text>
    </g>
  </g>

  <g id="stories">
    <text class="small leaf" x="80" y="1260">OUR STORY</text>
    <text class="h2 ink" x="80" y="1306">Small shop, carefully brewed</text>
    <rect class="surface" x="80" y="1350" width="650" height="430" rx="8"/>
    <rect class="image-box" x="106" y="1376" width="598" height="240" rx="8"/>
    <line class="image-line" x1="106" y1="1616" x2="704" y2="1376"/>
    <line class="image-line" x1="106" y1="1376" x2="704" y2="1616"/>
    <text class="label ink" x="405" y="1503" text-anchor="middle">Menu / Pairing Image</text>
    <text class="small leaf" x="106" y="1668">MENU PAIRING</text>
    <text class="h3 ink" x="106" y="1704">Coffee and baked sweets are designed together.</text>
    <text class="body muted" x="106" y="1738">Flavor, milk, butter, sweetness, and roast level are adjusted</text>
    <text class="body muted" x="106" y="1764">for the mood of each day.</text>

    <rect class="surface" x="765" y="1350" width="355" height="116" rx="8"/>
    <rect class="surface-alt" x="790" y="1377" width="76" height="62" rx="8"/>
    <text class="label leaf" x="828" y="1414" text-anchor="middle">8:00</text>
    <text class="small leaf" x="892" y="1395">MORNING</text>
    <text class="h3 ink" x="892" y="1430">Quiet start before work</text>

    <rect class="surface" x="765" y="1492" width="355" height="116" rx="8"/>
    <rect class="surface-alt" x="790" y="1519" width="76" height="62" rx="8"/>
    <text class="label leaf" x="828" y="1556" text-anchor="middle">13:00</text>
    <text class="small leaf" x="892" y="1537">CAFE TIME</text>
    <text class="h3 ink" x="892" y="1572">Reading and work seats</text>

    <rect class="surface" x="765" y="1634" width="355" height="116" rx="8"/>
    <rect class="surface-alt" x="790" y="1661" width="76" height="62" rx="8"/>
    <text class="label leaf" x="828" y="1698" text-anchor="middle">18:00</text>
    <text class="small leaf" x="892" y="1679">EVENING</text>
    <text class="h3 ink" x="892" y="1714">Take coffee home</text>
  </g>

  <g id="highlights">
    <text class="small leaf" x="80" y="1934">SHOP INFO</text>
    <text class="h2 ink" x="80" y="1980">Access, hours, and takeout</text>
    <rect class="surface" x="80" y="2024" width="570" height="310" rx="8"/>
    <text class="small leaf" x="110" y="2072">ACCESS / HOURS / TAKEOUT</text>
    <text class="h3 ink" x="110" y="2110">Seven minutes from the station.</text>
    <text class="body muted" x="110" y="2148">Small 18-seat cafe with Wi-Fi, takeout coffee,</text>
    <text class="body muted" x="110" y="2174">baked sweets, and reservation-friendly weekend seats.</text>
    <line class="line" x1="110" y1="2210" x2="620" y2="2210"/>
    <text class="micro muted" x="110" y="2244">Hours</text>
    <text class="label ink" x="240" y="2244">8:00-19:00 / Tuesday closed</text>
    <line class="line" x1="110" y1="2270" x2="620" y2="2270"/>
    <text class="micro muted" x="110" y="2304">Location</text>
    <text class="label ink" x="240" y="2304">Tokyo, 7 min walk from station</text>

    <rect class="surface" x="680" y="2024" width="440" height="310" rx="8"/>
    <rect class="image-box" x="710" y="2054" width="380" height="170" rx="8"/>
    <line class="image-line" x1="710" y1="2224" x2="1090" y2="2054"/>
    <line class="image-line" x1="710" y1="2054" x2="1090" y2="2224"/>
    <text class="label ink" x="900" y="2147" text-anchor="middle">Interior Image</text>
    <text class="h3 ink" x="710" y="2272">Reservations and takeout</text>
    <a href="#cta">
      <rect class="surface" x="710" y="2296" width="140" height="40" rx="20"/>
      <text class="button-text ink" x="780" y="2322" text-anchor="middle">Contact</text>
    </a>
  </g>

  <g id="cta">
    <rect class="surface-alt" x="80" y="2400" width="1040" height="132" rx="8"/>
    <text class="small leaf" x="600" y="2434" text-anchor="middle">RESERVATION</text>
    <text class="h2 ink" x="600" y="2476" text-anchor="middle">Book a weekend morning seat</text>
    <a href="mailto:hello@example.com">
      <rect class="coffee" x="420" y="2498" width="170" height="44" rx="22"/>
      <text class="button-text" x="505" y="2526" text-anchor="middle" fill="#ffffff">Send Email</text>
    </a>
    <a href="tel:0312345678">
      <rect class="surface" x="610" y="2498" width="170" height="44" rx="22"/>
      <text class="button-text ink" x="695" y="2526" text-anchor="middle">03-1234-5678</text>
    </a>
  </g>
</svg>
