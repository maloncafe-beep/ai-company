<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#4A6CF7" stroke-width="0.5" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Golden ratio spiral (arcs) -->
  <g fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65" stroke-linecap="round">
    <path d="M 200 175 Q 200 110 268 110"/>
    <path d="M 268 110 Q 336 110 336 178"/>
    <path d="M 336 178 Q 336 312 200 312"/>
    <path d="M 200 312 Q 64 312 64 178"/>
    <path d="M 64 178 Q 64 70 200 70"/>
  </g>

  <!-- Concentric circles -->
  <g fill="none" stroke="#3B5FE8" stroke-width="0.7" opacity="0.3">
    <circle cx="200" cy="178" r="110"/>
    <circle cx="200" cy="178" r="76"/>
    <circle cx="200" cy="178" r="42"/>
  </g>

  <!-- Cross-hair -->
  <g stroke="#3B5FE8" stroke-width="0.7" opacity="0.3" stroke-linecap="round">
    <line x1="200" y1="68" x2="200" y2="288"/>
    <line x1="90" y1="178" x2="310" y2="178"/>
  </g>

  <!-- Network edges -->
  <g stroke="#4A6CF7" stroke-width="2.2" opacity="0.65" fill="none" stroke-linecap="round">
    <line x1="200" y1="178" x2="158" y2="120"/>
    <line x1="200" y1="178" x2="254" y2="128"/>
    <line x1="200" y1="178" x2="268" y2="214"/>
    <line x1="200" y1="178" x2="145" y2="232"/>
    <line x1="200" y1="178" x2="132" y2="172"/>
    <line x1="158" y1="120" x2="254" y2="128"/>
    <line x1="254" y1="128" x2="268" y2="214"/>
    <line x1="268" y1="214" x2="145" y2="232"/>
    <line x1="145" y1="232" x2="132" y2="172"/>
  </g>

  <!-- Network nodes -->
  <g fill="#4A6CF7" opacity="0.75">
    <circle cx="158" cy="120" r="4.5"/>
    <circle cx="254" cy="128" r="4.5"/>
    <circle cx="268" cy="214" r="4.5"/>
    <circle cx="145" cy="232" r="4.5"/>
    <circle cx="132" cy="172" r="4.5"/>
  </g>

  <!-- Center dot -->
  <circle cx="200" cy="178" r="10" fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65"/>
  <circle cx="200" cy="178" r="4.5" fill="#3B5FE8" opacity="0.9"/>

  <!-- Divider line above text -->
  <line x1="120" y1="300" x2="280" y2="300" stroke="#4A6CF7" stroke-width="2.2" opacity="0.65" stroke-linecap="round"/>

  <!-- Main text: Structure -->
  <text
    x="200" y="328"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="26"
    font-weight="700"
    letter-spacing="3"
    fill="#1a2a6c"
    opacity="0.88">Structure</text>

  <!-- Sub text -->
  <text
    x="200" y="350"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="12"
    letter-spacing="3"
    fill="#4A6CF7"
    opacity="0.7">&gt; Intuition</text>

  <!-- Corner marks -->
  <g stroke="#4A6CF7" stroke-width="2.2" opacity="0.65" stroke-linecap="round">
    <line x1="22" y1="22" x2="42" y2="22"/>
    <line x1="22" y1="22" x2="22" y2="42"/>
    <line x1="378" y1="22" x2="358" y2="22"/>
    <line x1="378" y1="22" x2="378" y2="42"/>
    <line x1="22" y1="378" x2="42" y2="378"/>
    <line x1="22" y1="378" x2="22" y2="358"/>
    <line x1="378" y1="378" x2="358" y2="378"/>
    <line x1="378" y1="378" x2="378" y2="358"/>
  </g>
</svg>
