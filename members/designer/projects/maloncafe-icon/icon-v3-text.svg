<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg3)"/>

  <!-- Very subtle fine grid -->
  <g stroke="#ffffff" stroke-width="0.25" opacity="0.04">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Minimal geometric accent: top horizontal bar -->
  <rect x="155" y="108" width="90" height="1.5" fill="#4A6CF7" opacity="0.7" rx="1"/>

  <!-- Small diamond -->
  <polygon points="200,118 208,128 200,138 192,128"
    fill="none" stroke="#4A6CF7" stroke-width="1.2" opacity="0.5"/>
  <circle cx="200" cy="128" r="2.5" fill="#4A6CF7" opacity="0.8"/>

  <!-- Main text: Structure -->
  <text
    x="200" y="198"
    text-anchor="middle"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="38"
    font-weight="700"
    letter-spacing="3"
    fill="#ffffff"
    opacity="0.92">Structure</text>

  <!-- Divider line -->
  <line x1="110" y1="215" x2="290" y2="215" stroke="#4A6CF7" stroke-width="0.8" opacity="0.5"/>

  <!-- Sub text: > Intuition -->
  <text
    x="200" y="244"
    text-anchor="middle"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="16"
    letter-spacing="4"
    fill="#6B8AF9"
    opacity="0.75">&gt; Intuition</text>

  <!-- Bottom minimal accent -->
  <rect x="155" y="272" width="90" height="1" fill="#4A6CF7" opacity="0.4" rx="1"/>

  <!-- Corner marks -->
  <g stroke="#4A6CF7" stroke-width="0.8" opacity="0.25">
    <line x1="25" y1="25" x2="45" y2="25"/>
    <line x1="25" y1="25" x2="25" y2="45"/>
    <line x1="375" y1="25" x2="355" y2="25"/>
    <line x1="375" y1="25" x2="375" y2="45"/>
    <line x1="25" y1="375" x2="45" y2="375"/>
    <line x1="25" y1="375" x2="25" y2="355"/>
    <line x1="375" y1="375" x2="355" y2="375"/>
    <line x1="375" y1="375" x2="375" y2="355"/>
  </g>
</svg>
