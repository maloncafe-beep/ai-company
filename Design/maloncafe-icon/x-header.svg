<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#131d2e"/>
      <stop offset="100%" stop-color="#060910"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="38%">
      <stop offset="0%" stop-color="#4A6CF7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4A6CF7" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-width="0.25" opacity="0.03">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1100" y1="0" x2="1100" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
    <line x1="1300" y1="0" x2="1300" y2="500"/>
    <line x1="1400" y1="0" x2="1400" y2="500"/>
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
  </g>

  <!-- Glow centered on geometric design -->
  <ellipse cx="750" cy="355" rx="360" ry="180" fill="url(#glow)"/>

  <!-- ===== Text zone (上半分) ===== -->

  <!-- 違和感収集家 — top, blue -->
  <text
    x="750" y="66"
    text-anchor="middle"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="5"
    fill="#6B8AF9"
    opacity="0.85">違和感収集家</text>

  <!-- Thin accent line -->
  <line x1="688" y1="80" x2="812" y2="80" stroke="#4A6CF7" stroke-width="0.7" opacity="0.45"/>

  <!-- 構造で考える — center-upper, white -->
  <text
    x="750" y="148"
    text-anchor="middle"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="4"
    fill="#ffffff"
    opacity="0.92">構造で考える</text>

  <!-- ===== Geometric design — lower center (center at 750, 340) ===== -->

  <!-- Golden ratio spiral -->
  <g fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65" stroke-linecap="round">
    <path d="M 750 336 Q 750 258 832 258"/>
    <path d="M 832 258 Q 913 258 913 340"/>
    <path d="M 913 340 Q 913 500 750 500"/>
    <path d="M 750 500 Q 587 500 587 340"/>
    <path d="M 587 340 Q 587 210 750 210"/>
  </g>

  <!-- Concentric circles -->
  <g fill="none" stroke="#3B5FE8" stroke-width="0.7" opacity="0.3">
    <circle cx="750" cy="340" r="132"/>
    <circle cx="750" cy="340" r="74"/>
  </g>

  <!-- Cross-hair -->
  <g stroke="#3B5FE8" stroke-width="0.7" opacity="0.3" stroke-linecap="round">
    <line x1="750" y1="208" x2="750" y2="472"/>
    <line x1="618" y1="340" x2="882" y2="340"/>
  </g>

  <!-- Network edges -->
  <g stroke="#4A6CF7" stroke-width="2.2" opacity="0.65" fill="none" stroke-linecap="round">
    <line x1="750" y1="340" x2="700" y2="262"/>
    <line x1="750" y1="340" x2="815" y2="272"/>
    <line x1="750" y1="340" x2="832" y2="383"/>
    <line x1="750" y1="340" x2="684" y2="405"/>
    <line x1="750" y1="340" x2="668" y2="333"/>
    <line x1="700" y1="262" x2="815" y2="272"/>
    <line x1="815" y1="272" x2="832" y2="383"/>
    <line x1="832" y1="383" x2="684" y2="405"/>
    <line x1="684" y1="405" x2="668" y2="333"/>
  </g>

  <!-- Network nodes -->
  <g fill="#4A6CF7" opacity="0.75">
    <circle cx="700" cy="262" r="4.5"/>
    <circle cx="815" cy="272" r="4.5"/>
    <circle cx="832" cy="383" r="4.5"/>
    <circle cx="684" cy="405" r="4.5"/>
    <circle cx="668" cy="333" r="4.5"/>
  </g>

  <!-- Center dot -->
  <circle cx="750" cy="340" r="10" fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65"/>
  <circle cx="750" cy="340" r="4.5" fill="#3B5FE8" opacity="0.9"/>

  <!-- Corner marks -->
  <g stroke="#4A6CF7" stroke-width="0.8" opacity="0.2">
    <line x1="28" y1="25" x2="62" y2="25"/>
    <line x1="28" y1="25" x2="28" y2="62"/>
    <line x1="1472" y1="25" x2="1438" y2="25"/>
    <line x1="1472" y1="25" x2="1472" y2="62"/>
    <line x1="28" y1="475" x2="62" y2="475"/>
    <line x1="28" y1="475" x2="28" y2="438"/>
    <line x1="1472" y1="475" x2="1438" y2="475"/>
    <line x1="1472" y1="475" x2="1472" y2="438"/>
  </g>
</svg>
