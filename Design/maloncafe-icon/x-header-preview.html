<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>X Header Preview — 違和感収集家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; gap: 0; padding: 32px 16px; }
  h1 { margin-bottom: 20px; font-size: 13px; letter-spacing: 3px; color: #6B8AF9; text-transform: uppercase; }
  #svg-container { width: 100%; max-width: 960px; border-radius: 8px; overflow: hidden; }
  #svg-container svg { width: 100%; height: auto; display: block; }
  .actions { margin-top: 20px; display: flex; gap: 12px; }
  .btn {
    padding: 10px 28px;
    background: #4A6CF7;
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #3B5FE8; }
  .btn:disabled { background: #2a3a6a; cursor: not-allowed; }
  .note { margin-top: 14px; font-size: 11px; color: #4A6CF7; opacity: 0.6; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>違和感収集家 — X Header Preview</h1>

  <div id="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
      <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="65%">
          <stop offset="0%" stop-color="#131d2e"/>
          <stop offset="100%" stop-color="#060910"/>
        </radialGradient>
        <radialGradient id="glow" cx="50%" cy="72%" r="38%">
          <stop offset="0%" stop-color="#4A6CF7" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#4A6CF7" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1500" height="500" fill="url(#bg)"/>
      <g stroke="#ffffff" stroke-width="0.25" opacity="0.03">
        <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
        <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
        <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
        <line x1="700" y1="0" x2="700" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
        <line x1="900" y1="0" x2="900" y2="500"/><line x1="1000" y1="0" x2="1000" y2="500"/>
        <line x1="1100" y1="0" x2="1100" y2="500"/><line x1="1200" y1="0" x2="1200" y2="500"/>
        <line x1="1300" y1="0" x2="1300" y2="500"/><line x1="1400" y1="0" x2="1400" y2="500"/>
        <line x1="0" y1="100" x2="1500" y2="100"/><line x1="0" y1="200" x2="1500" y2="200"/>
        <line x1="0" y1="300" x2="1500" y2="300"/><line x1="0" y1="400" x2="1500" y2="400"/>
      </g>
      <ellipse cx="750" cy="355" rx="360" ry="180" fill="url(#glow)"/>
      <text x="750" y="66" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#6B8AF9" opacity="0.85">違和感収集家</text>
      <line x1="688" y1="80" x2="812" y2="80" stroke="#4A6CF7" stroke-width="0.7" opacity="0.45"/>
      <text x="750" y="148" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.92">構造で考える</text>
      <g fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65" stroke-linecap="round">
        <path d="M 750 336 Q 750 258 832 258"/>
        <path d="M 832 258 Q 913 258 913 340"/>
        <path d="M 913 340 Q 913 500 750 500"/>
        <path d="M 750 500 Q 587 500 587 340"/>
        <path d="M 587 340 Q 587 210 750 210"/>
      </g>
      <g fill="none" stroke="#3B5FE8" stroke-width="0.7" opacity="0.3">
        <circle cx="750" cy="340" r="132"/><circle cx="750" cy="340" r="74"/>
      </g>
      <g stroke="#3B5FE8" stroke-width="0.7" opacity="0.3" stroke-linecap="round">
        <line x1="750" y1="208" x2="750" y2="472"/>
        <line x1="618" y1="340" x2="882" y2="340"/>
      </g>
      <g stroke="#4A6CF7" stroke-width="2.2" opacity="0.65" fill="none" stroke-linecap="round">
        <line x1="750" y1="340" x2="700" y2="262"/><line x1="750" y1="340" x2="815" y2="272"/>
        <line x1="750" y1="340" x2="832" y2="383"/><line x1="750" y1="340" x2="684" y2="405"/>
        <line x1="750" y1="340" x2="668" y2="333"/><line x1="700" y1="262" x2="815" y2="272"/>
        <line x1="815" y1="272" x2="832" y2="383"/><line x1="832" y1="383" x2="684" y2="405"/>
        <line x1="684" y1="405" x2="668" y2="333"/>
      </g>
      <g fill="#4A6CF7" opacity="0.75">
        <circle cx="700" cy="262" r="4.5"/><circle cx="815" cy="272" r="4.5"/>
        <circle cx="832" cy="383" r="4.5"/><circle cx="684" cy="405" r="4.5"/>
        <circle cx="668" cy="333" r="4.5"/>
      </g>
      <circle cx="750" cy="340" r="10" fill="none" stroke="#3B5FE8" stroke-width="2.2" opacity="0.65"/>
      <circle cx="750" cy="340" r="4.5" fill="#3B5FE8" opacity="0.9"/>
      <g stroke="#4A6CF7" stroke-width="0.8" opacity="0.2">
        <line x1="28" y1="25" x2="62" y2="25"/><line x1="28" y1="25" x2="28" y2="62"/>
        <line x1="1472" y1="25" x2="1438" y2="25"/><line x1="1472" y1="25" x2="1472" y2="62"/>
        <line x1="28" y1="475" x2="62" y2="475"/><line x1="28" y1="475" x2="28" y2="438"/>
        <line x1="1472" y1="475" x2="1438" y2="475"/><line x1="1472" y1="475" x2="1472" y2="438"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn" id="pngBtn">PNG に変換してダウンロード</button>
  </div>
  <p class="note">1500 × 500 px</p>

  <script>
    document.getElementById('pngBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '変換中...';

      await document.fonts.ready;

      const svg = document.querySelector('#svg-container svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 1500;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 1500, 500);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = 'maloncafe-x-header.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        btn.disabled = false;
        btn.textContent = 'PNG に変換してダウンロード';
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        alert('変換に失敗しました。もう一度お試しください。');
        btn.disabled = false;
        btn.textContent = 'PNG に変換してダウンロード';
      };
      img.src = url;
    });
  </script>
</body>
</html>
