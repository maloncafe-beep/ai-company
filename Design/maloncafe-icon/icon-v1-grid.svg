<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="0"/>

  <!-- Subtle grid lines -->
  <g stroke="#c7d5f5" stroke-width="0.5" opacity="0.6">
    <!-- Vertical -->
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <!-- Horizontal -->
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Golden ratio spiral (approximation with arcs) -->
  <g fill="none" stroke="#4A6CF7" stroke-width="1.5" opacity="0.25">
    <path d="M 200 200 Q 200 115 285 115"/>
    <path d="M 285 115 Q 370 115 370 200"/>
    <path d="M 370 200 Q 370 340 200 340"/>
    <path d="M 200 340 Q 30 340 30 200"/>
    <path d="M 30 200 Q 30 60 200 60"/>
  </g>

  <!-- Central concentric circles -->
  <g fill="none" stroke="#3B5FE8" opacity="0.12">
    <circle cx="200" cy="200" r="140" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="100" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="60" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="25" stroke-width="0.8"/>
  </g>

  <!-- Cross-hair center lines -->
  <g stroke="#3B5FE8" stroke-width="0.8" opacity="0.3">
    <line x1="200" y1="60" x2="200" y2="340"/>
    <line x1="60" y1="200" x2="340" y2="200"/>
  </g>

  <!-- Network nodes and connections -->
  <g stroke="#4A6CF7" stroke-width="1" opacity="0.35" fill="none">
    <line x1="200" y1="200" x2="160" y2="140"/>
    <line x1="200" y1="200" x2="255" y2="148"/>
    <line x1="200" y1="200" x2="270" y2="240"/>
    <line x1="200" y1="200" x2="145" y2="260"/>
    <line x1="200" y1="200" x2="130" y2="195"/>
    <line x1="160" y1="140" x2="255" y2="148"/>
    <line x1="255" y1="148" x2="270" y2="240"/>
    <line x1="270" y1="240" x2="145" y2="260"/>
    <line x1="145" y1="260" x2="130" y2="195"/>
  </g>

  <!-- Network node dots -->
  <g fill="#4A6CF7" opacity="0.5">
    <circle cx="160" cy="140" r="3"/>
    <circle cx="255" cy="148" r="3"/>
    <circle cx="270" cy="240" r="3"/>
    <circle cx="145" cy="260" r="3"/>
    <circle cx="130" cy="195" r="3"/>
  </g>

  <!-- Center dot -->
  <circle cx="200" cy="200" r="5" fill="#3B5FE8" opacity="0.8"/>
  <circle cx="200" cy="200" r="10" fill="none" stroke="#3B5FE8" stroke-width="1.5" opacity="0.5"/>
</svg>
